name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy run in separate jobs, like GitHub's other Pages starter workflows.
# In a single job, deploy-pages can look up the artifact a few hundred milliseconds
# after the upload finished and not find it yet ("No artifacts named github-pages
# were found", actions/deploy-pages#451).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare site
        run: |
          mkdir _site
          cp -r *.html CNAME app-ads.txt sitemap.xml assets de en _site/
          find _site -name .DS_Store -delete

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
